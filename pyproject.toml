[project]
name = "KeepIt"
version = "0.1.0"
description = "An Inventory Management Software"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nico"},
    { name = "Joshua"},
    { name = "Lars"},
    { name = "Laura"},
]
dependencies = [
    "flet>=0.86.5",
    "flet[test]>=0.86.5",
    "flet-datatable2>=0.86.5",
    "pysqlite3>=0.6.0",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "KeepIt"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

name: Builds

on:
  workflow_dispatch:   # Startknopf im Actions-Tab
  push:
    tags:
      - "v*"           # startet auch bei Tags wie v0.1.0

jobs:
  build:
    strategy:
      fail-fast: false   # ein fehlgeschlagenes System stoppt die anderen nicht
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"                   # verhindert den Unicode-Fehler unter Windows
      FLET_CLI_NO_RICH_OUTPUT: "1"      # schlichte Textausgabe statt Animationen

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux-Pakete installieren
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: Flet installieren
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: App bauen
        run: flet build ${{ matrix.target }} --yes -v

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: build/${{ matrix.target }}

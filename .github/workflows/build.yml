name: Builds

on:
  workflow_dispatch:   # Startknopf im Actions-Tab
  push:
    tags:
      - "v*"           # startet auch bei Tags wie v0.1.0

permissions:
  contents: write       # noetig, damit der Release-Job Dateien anhaengen darf

jobs:
  build:
    strategy:
      fail-fast: false   # ein fehlgeschlagenes System stoppt die anderen nicht
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"                   # verhindert den Unicode-Fehler unter Windows
      FLET_CLI_NO_RICH_OUTPUT: "1"      # schlichte Textausgabe statt Animationen

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux-Pakete installieren
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libsqlite3-dev

      - name: Flet installieren
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: SQLite fuer macOS installieren
        if: matrix.target == 'macos'
        run: brew install sqlite

      - name: App bauen (macOS)
        if: matrix.target == 'macos'
        env:
          CFLAGS: -I/opt/homebrew/opt/sqlite/include
          LDFLAGS: -L/opt/homebrew/opt/sqlite/lib
        run: flet build macos --yes -v

      - name: App bauen (Windows und Linux)
        if: matrix.target != 'macos'
        run: flet build ${{ matrix.target }} --yes -v

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: build/${{ matrix.target }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Ergebnisse herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Ordner zu ZIP-Dateien packen
        run: |
          cd artifacts
          for ordner in *-build; do
            zip -r "../${ordner}.zip" "$ordner"
          done

      - name: An Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build.zip
            macos-build.zip
            linux-build.zip
